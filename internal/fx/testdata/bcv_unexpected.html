<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<title>Banco Central de Venezuela</title></head><body>
<!-- Captured verbatim from https://www.bcv.org.ve/ on 2026-09-11 (Caracas).
     Trimmed to the rate section; the markup inside is unmodified, quirks included:
     inconsistent whitespace in the currency labels, a comma decimal separator,
     eight decimal places, and a Fecha Valor that is FOUR DAYS AFTER the capture. -->
<div class="col"><p>El sitio se encuentra en mantenimiento.</p></div>
<!-- A sixth element carrying the value class, elsewhere on the real page and not a
     rate. It is why the parser anchors on the block ids and never on position. -->
<div class="row"><strong class="strong-tb">INPC 2026</strong></div>
<!-- Other date elements the real page carries, which is why the Fecha Valor label
     is located by its text rather than by taking the first date element. -->
<span class="date-display-single" property="dc:date" content="2026-08-01T00:00:00-04:00">Agosto - 2026</span>
</body></html>
