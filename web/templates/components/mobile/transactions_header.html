{{ define "transactions_header" }}
<header class="mobile-header mobile-transactions-header">
  <div class="mobile-header-text">
    <div class="header-badge-row">
      <h1 class="mobile-greeting">Movimientos</h1>
      <span class="header-count-pill">{{ .TotalCount }} operaciones</span>
    </div>
    <p class="mobile-date">{{ .CurrentPeriodLabel }}</p>
  </div>
  <button id="transactions-filter-toggle-btn" class="mobile-avatar-btn" type="button" aria-label="Filtros avanzados" title="Filtros avanzados">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
    </svg>
  </button>
</header>
{{ end }}
