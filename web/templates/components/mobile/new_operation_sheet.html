{{ define "new_operation_sheet" }}
<div id="operation-sheet-backdrop" class="sheet-backdrop" aria-hidden="true"></div>
<div id="operation-sheet" class="sheet-container" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-hidden="true">
  <div class="sheet-drag-area" id="sheet-drag-handle">
    <span class="sheet-handle-pill" aria-hidden="true"></span>
  </div>

  <div class="sheet-header">
    <h3 id="sheet-title" class="sheet-title">Nueva operación</h3>
    <button id="sheet-close-btn" class="sheet-close-button" type="button" aria-label="Cerrar modal">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <div class="sheet-content">
    <div class="operation-grid">
      <!-- Gasto -->
      <a href="/mobile/operacion/nueva?type=EXPENSE" class="op-button op-button-expense" data-operation-type="expense" role="button">
        <div class="op-icon-pill expense-pill" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="7" y1="7" x2="17" y2="17"></line>
            <polyline points="17 7 17 17 7 17"></polyline>
          </svg>
        </div>
        <div class="op-text-block">
          <span class="op-title">Gasto</span>
          <span class="op-description">Registrar salida de dinero</span>
        </div>
        <svg class="op-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </a>

      <!-- Ingreso -->
      <a href="/mobile/operacion/nueva?type=INCOME" class="op-button op-button-income" data-operation-type="income" role="button">
        <div class="op-icon-pill income-pill" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="7" y1="17" x2="17" y2="7"></line>
            <polyline points="7 7 17 7 17 17"></polyline>
          </svg>
        </div>
        <div class="op-text-block">
          <span class="op-title">Ingreso</span>
          <span class="op-description">Registrar entrada de dinero</span>
        </div>
        <svg class="op-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </a>

      <!-- Transferencia -->
      <a href="/mobile/operacion/nueva?type=TRANSFER" class="op-button op-button-transfer" data-operation-type="transfer" role="button">
        <div class="op-icon-pill transfer-pill" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"></polyline>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
            <polyline points="7 23 3 19 7 15"></polyline>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
          </svg>
        </div>
        <div class="op-text-block">
          <span class="op-title">Transferencia</span>
          <span class="op-description">Mover saldo entre cuentas</span>
        </div>
        <svg class="op-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </a>
      <!-- Cambiar divisas -->
      <a href="/mobile/operacion/nueva?type=FX_EXCHANGE" class="op-button op-button-exchange" data-operation-type="fx_exchange" role="button">
        <div class="op-icon-pill exchange-pill" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"></polyline>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
            <polyline points="7 23 3 19 7 15"></polyline>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
            <line x1="12" y1="2" x2="12" y2="22"></line>
          </svg>
        </div>
        <div class="op-text-block">
          <span class="op-title">Cambiar divisas</span>
          <span class="op-description">Comprar o vender USD, EUR…</span>
        </div>
        <svg class="op-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </a>
    </div>

    <button id="sheet-cancel-button" class="sheet-cancel-btn" type="button">
      Cancelar
    </button>
  </div>
</div>
{{ end }}
