{{ define "operation_form" }}
<div class="mobile-operation-screen">
  <!-- Top bar con Cancelar y Título -->
  <div class="operation-screen-header">
    <a href="javascript:history.back()" class="op-nav-back-link" aria-label="Volver">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Atrás</span>
    </a>
    <h2 class="op-screen-title">Nueva operación</h2>
    <div style="width: 48px;"></div>
  </div>

  <div style="background: #f8fafc; border-bottom: 1px solid #e2e8f0; padding: 8px 16px; font-size: 0.78rem; color: #64748b; display: flex; align-items: center; justify-content: space-between;">
    <span>📱 Prototipo UI móvil (Mocks)</span>
    <a href="/transfers/new" style="color: #2563eb; text-decoration: underline; font-weight: 500;">Formulario web real &rarr;</a>
  </div>

  <form id="mobile-operation-form" action="/transactions" method="POST" class="operation-form-body">
    <!-- Switcher de Tipo de Operación: Gasto / Ingreso / Transferencia -->
    <div class="op-type-segmented-control" role="tablist">
      <button type="button" class="op-type-tab {{ if eq .SelectedType "EXPENSE" }}is-active type-expense{{ end }}" data-type="EXPENSE" role="tab" aria-selected="{{ if eq .SelectedType "EXPENSE" }}true{{ else }}false{{ end }}">
        Gasto
      </button>
      <button type="button" class="op-type-tab {{ if eq .SelectedType "INCOME" }}is-active type-income{{ end }}" data-type="INCOME" role="tab" aria-selected="{{ if eq .SelectedType "INCOME" }}true{{ else }}false{{ end }}">
        Ingreso
      </button>
      <button type="button" class="op-type-tab {{ if eq .SelectedType "TRANSFER" }}is-active type-transfer{{ end }}" data-type="TRANSFER" role="tab" aria-selected="{{ if eq .SelectedType "TRANSFER" }}true{{ else }}false{{ end }}">
        Transferencia
      </button>
    </div>
    <input type="hidden" id="op-input-type" name="type" value="{{ .SelectedType }}">

    <!-- Display de Monto Grande con selector de moneda -->
    <div class="amount-hero-display">
      <span class="amount-hero-label">Monto de la operación</span>
      <div class="amount-hero-input-wrap">
        <select id="op-currency-select" class="amount-currency-pill" aria-label="Moneda">
          <option value="USD" selected>USD ($)</option>
          <option value="VES">VES (Bs)</option>
          <option value="EUR">EUR (€)</option>
        </select>
        <input 
          type="text" 
          id="op-amount-input" 
          name="amount" 
          class="amount-hero-number-input" 
          placeholder="0.00" 
          inputmode="decimal" 
          required 
          autocomplete="off"
          aria-label="Monto"
        >
      </div>
    </div>

    <!-- Campos de selección -->
    <div class="op-fields-container">
      <!-- Cuenta de origen -->
      <div class="op-field-group">
        <label class="op-field-label" for="op-account-select">
          <span id="label-origin-account">Cuenta</span>
          <span class="required-star">*</span>
        </label>
        <div class="op-select-wrap">
          <select id="op-account-select" name="account_id" class="op-native-select" required>
            <option value="">Selecciona una cuenta...</option>
            <option value="1">Mercantil USD · $1,650.00</option>
            <option value="4" selected>Banesco Corriente · Bs 142,548.84</option>
            <option value="2">Tarjeta prepagada USD · $350.00</option>
            <option value="5">Efectivo Bolívares · Bs 8,000.00</option>
            <option value="3">Efectivo USD · $57.56</option>
            <option value="6">Cuenta Europa EUR · €850.00</option>
          </select>
          <svg class="select-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
      </div>

      <!-- Cuenta de destino (Visible solo en Transferencia) -->
      <div id="op-destination-group" class="op-field-group" style="display: none;">
        <label class="op-field-label" for="op-dest-account-select">
          <span>Cuenta de destino</span>
          <span class="required-star">*</span>
        </label>
        <div class="op-select-wrap">
          <select id="op-dest-account-select" name="destination_account_id" class="op-native-select">
            <option value="">Selecciona cuenta receptora...</option>
            <option value="1">Mercantil USD</option>
            <option value="4">Banesco Corriente</option>
            <option value="2">Tarjeta prepagada USD</option>
            <option value="5">Efectivo Bolívares</option>
          </select>
          <svg class="select-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
      </div>

      <!-- Categoría (Solo en Gasto o Ingreso) -->
      <div id="op-category-group" class="op-field-group">
        <label class="op-field-label">
          <span>Categoría</span>
          <span class="required-star">*</span>
        </label>
        <div class="op-category-chips-grid" role="radiogroup" aria-label="Seleccionar categoría">
          <label class="op-cat-chip is-selected">
            <input type="radio" name="category_id" value="1" checked class="sr-only">
            <span class="op-cat-icon">🛒</span>
            <span class="op-cat-text">Alimentación</span>
          </label>
          <label class="op-cat-chip">
            <input type="radio" name="category_id" value="2" class="sr-only">
            <span class="op-cat-icon">☕</span>
            <span class="op-cat-text">Comida & Café</span>
          </label>
          <label class="op-cat-chip">
            <input type="radio" name="category_id" value="3" class="sr-only">
            <span class="op-cat-icon">🚗</span>
            <span class="op-cat-text">Transporte</span>
          </label>
          <label class="op-cat-chip">
            <input type="radio" name="category_id" value="4" class="sr-only">
            <span class="op-cat-icon">💊</span>
            <span class="op-cat-text">Salud</span>
          </label>
          <label class="op-cat-chip">
            <input type="radio" name="category_id" value="5" class="sr-only">
            <span class="op-cat-icon">🎬</span>
            <span class="op-cat-text">Entretenimiento</span>
          </label>
          <label class="op-cat-chip">
            <input type="radio" name="category_id" value="6" class="sr-only">
            <span class="op-cat-icon">💼</span>
            <span class="op-cat-text">Ingresos</span>
          </label>
        </div>
      </div>

      <!-- Método de pago -->
      <div class="op-field-group">
        <label class="op-field-label" for="op-method-select">
          <span>Método de pago / Canal</span>
        </label>
        <div class="op-select-wrap">
          <select id="op-method-select" name="payment_method_id" class="op-native-select">
            <option value="1">Pago Móvil</option>
            <option value="2">Transferencia bancaria</option>
            <option value="3">Tarjeta de débito</option>
            <option value="4">Efectivo</option>
            <option value="5">Zelle</option>
          </select>
          <svg class="select-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
      </div>

      <!-- Fecha -->
      <div class="op-field-group">
        <label class="op-field-label" for="op-date-input">
          <span>Fecha</span>
          <span class="required-star">*</span>
        </label>
        <input 
          type="date" 
          id="op-date-input" 
          name="effective_date" 
          class="op-native-input" 
          value="{{ .CurrentDate }}" 
          required
        >
      </div>

      <!-- Descripción / Concepto -->
      <div class="op-field-group">
        <label class="op-field-label" for="op-description-input">
          <span>Descripción o Comercio</span>
          <span class="optional-tag">(Opcional)</span>
        </label>
        <input 
          type="text" 
          id="op-description-input" 
          name="description" 
          class="op-native-input" 
          placeholder="Ej: Automercado Plaza's, Almuerzo..."
        >
      </div>
    </div>

    <!-- Botón de Confirmación -->
    <div class="op-submit-container">
      <button type="submit" id="op-submit-button" class="op-submit-btn btn-expense">
        Registrar Gasto
      </button>
    </div>
  </form>
</div>
{{ end }}
