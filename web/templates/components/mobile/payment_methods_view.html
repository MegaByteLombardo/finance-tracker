{{ define "payment_methods_view" }}
<div class="mobile-methods-screen">
  <header class="mobile-header">
    <div class="mobile-header-text">
      <h1 class="mobile-greeting">Métodos de pago</h1>
      <p class="mobile-date">Canales de pago y cobro</p>
    </div>
    <a href="/payment-methods/new" class="mobile-header-add-btn" aria-label="Nuevo método">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      <span>Nuevo</span>
    </a>
  </header>

  <main class="mobile-scrollable-content" style="gap: 16px; padding-bottom: calc(var(--bottom-nav-height) + env(safe-area-inset-bottom, 16px) + 30px);">
    <div class="balances-container" role="list">
      {{ range .Methods }}
      <div class="currency-row" role="listitem">
        <div class="currency-badge-wrap">
          <div class="account-icon-wrap type-wallet" style="width: 38px; height: 38px;" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
              <line x1="1" y1="10" x2="23" y2="10"></line>
            </svg>
          </div>
          <div>
            <div style="font-size: 0.9375rem; font-weight: 600; color: var(--m-text-primary);">{{ .Name }}</div>
            <div style="font-size: 0.75rem; color: var(--m-text-muted);">
              {{ if .IsActive }}<span style="color: var(--m-positive);">Activo</span>{{ else }}<span style="color: var(--m-text-subtle);">Archivado</span>{{ end }}
            </div>
          </div>
        </div>
        <div>
          <a href="/payment-methods/{{ .ID }}/edit" class="account-edit-icon-link" aria-label="Editar método {{ .Name }}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
          </a>
        </div>
      </div>
      {{ end }}
    </div>
  </main>
</div>
{{ end }}
