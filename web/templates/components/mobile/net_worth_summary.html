{{ define "net_worth_summary" }}
<section class="mobile-section net-worth-section" aria-labelledby="net-worth-heading">
  <span id="net-worth-heading" class="section-eyebrow">Patrimonio neto</span>
  <div class="net-worth-main">
    <span class="net-worth-amount">{{ .AmountFormatted }}</span>
  </div>
  <div class="net-worth-meta">
    <span class="net-worth-base-tag">{{ .CurrencyLabel }}</span>
    {{ if .RatesAsOf }}
    <span class="net-worth-rates-asof">Tasas al {{ .RatesAsOf }}</span>
    {{ end }}
  </div>
  {{ if not .Complete }}
  <p class="net-worth-incomplete" role="status">
    {{ .IncompleteMessage }}
    <a href="/mobile/tasas">Agregar tasa</a>
  </p>
  {{ end }}
</section>
{{ end }}
