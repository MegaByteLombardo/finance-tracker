<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1329">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>{{ if .Title }}{{ .Title }} · {{ end }}Finance Tracker</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/mobile.css">
  <script src="/static/js/theme.js"></script>
</head>
<body class="mobile-body">
  <!-- Barra de control en desktop (oculta en modo móvil real) -->
  <div class="desktop-preview-bar">
    <span class="preview-badge">📱 Finance Tracker · Vista Móvil</span>
    <div class="desktop-preview-links">
      <a href="/mobile" class="preview-link">Inicio</a>
      <a href="/mobile/movimientos" class="preview-link">Movimientos</a>
      <a href="/mobile/cuentas" class="preview-link">Cuentas</a>
      <a href="/" class="preview-link" onclick="sessionStorage.setItem('prefer_desktop', '1');">Ver escritorio</a>
    </div>
  </div>

  {{ template "content" .Data }}
  <script src="/static/js/mobile.js"></script>
</body>
</html>
